fraud_dbt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'fraud_user') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD', 'fraud_pass') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'fraud_detection') }}"
      schema: staging
      threads: 4
